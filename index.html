<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>번쩍 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b1340; --stage:#2a1c5e; --sand:#fdf3df; --coral:#ff4d66;
    --mint:#4fe0bd; --sun:#ffc93c; --grape:#b06bff; --dim:#b3a5e0;
    --page:#150e33; --ink:var(--sand);
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --page:#f0e6ff } }
  :root[data-theme="light"]{ --page:#f0e6ff } :root[data-theme="dark"]{ --page:#150e33 }

  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--page);color:var(--ink);
    font-family:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  body::before{
    content:"";position:fixed;inset:-30%;z-index:-1;
    background:
      radial-gradient(38% 38% at 20% 25%, #ff4d66 0%, transparent 60%),
      radial-gradient(34% 34% at 80% 20%, #ffc93c 0%, transparent 60%),
      radial-gradient(40% 40% at 78% 80%, #4fe0bd 0%, transparent 62%),
      radial-gradient(36% 36% at 22% 82%, #b06bff 0%, transparent 60%),
      radial-gradient(30% 30% at 50% 50%, #3ba7ff 0%, transparent 65%);
    filter:blur(30px);opacity:.75;
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1) rotate(0deg)}
    50%{transform:translate(3%,-3%) scale(1.12) rotate(6deg)}
    100%{transform:translate(-3%,2%) scale(1.05) rotate(-5deg)}
  }
  .stage{
    width:100%;max-width:640px;background:rgba(27,19,64,.9);
    backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);
    border-radius:30px;padding:34px 28px 30px;
    box-shadow:0 26px 70px rgba(10,5,35,.5);
    min-height:560px;display:flex;flex-direction:column;
  }
  h1,h2,.big,.opt-key,.count,.lvl-n,.tick,.score,.q{font-family:"Jua",system-ui,sans-serif;font-weight:400}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  button{font-family:inherit;cursor:pointer;border:0}
  button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

  /* 시작 */
  #home{align-items:center;justify-content:center;text-align:center}
  .bolt{font-size:clamp(70px,20vw,110px);line-height:1}
  #home h1{font-size:clamp(32px,9vw,46px);margin:6px 0 0}
  #home p{color:var(--dim);margin:12px 0 30px;font-size:15px;line-height:1.7}
  .start{
    font-family:"Jua",sans-serif;font-size:24px;color:var(--night);
    background:var(--sun);border-radius:999px;padding:16px 56px;
    box-shadow:0 8px 0 #d29b13;transition:transform .12s,box-shadow .12s;
  }
  .start:active{transform:translateY(5px);box-shadow:0 3px 0 #d29b13}

  /* 선택 화면 */
  .pick{align-items:center;justify-content:center;text-align:center}
  .pick h2{font-size:26px;margin:0 0 6px}
  .pick .sub{color:var(--dim);font-size:14px;margin:0 0 26px}
  .levels{display:grid;gap:12px;width:100%;max-width:380px}
  .lvl{
    display:flex;align-items:center;gap:14px;text-align:left;
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);
    border-radius:18px;padding:15px 18px;color:var(--sand);
    transition:background .15s,border-color .15s,transform .12s;
  }
  .lvl:hover{background:rgba(255,255,255,.14)}
  .lvl:active{transform:scale(.98)}
  .lvl[data-l="1"]:hover{border-color:var(--mint)}
  .lvl[data-l="2"]:hover{border-color:var(--sun)}
  .lvl[data-l="3"]:hover{border-color:var(--coral)}
  .lvl-n{font-size:30px;width:34px;text-align:center;flex:none}
  .lvl[data-l="1"] .lvl-n{color:var(--mint)} .lvl[data-l="2"] .lvl-n{color:var(--sun)} .lvl[data-l="3"] .lvl-n{color:var(--coral)}
  .lvl b{display:block;font-size:17px;font-weight:700}
  .lvl span{font-size:12.5px;color:var(--dim)}
  .counts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:340px}
  .count{
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);
    border-radius:18px;padding:20px 0;font-size:30px;line-height:1;color:var(--sand);
    transition:background .15s,border-color .15s,transform .12s;
  }
  .count span{display:block;font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--dim);margin-top:8px}
  .count:hover{background:rgba(79,224,189,.16);border-color:var(--mint)}
  .count:active{transform:scale(.97)}
  .back{background:none;color:var(--dim);font-size:13px;margin-top:24px;text-decoration:underline}

  /* 퀴즈 */
  .hud{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}
  .hud b{font-family:"Jua",sans-serif;font-size:17px;color:var(--sand);font-weight:400}
  .tag{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px}
  .mid{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 6px}
  .pic{
    width:96px;height:96px;flex:none;border-radius:24px;display:grid;place-items:center;
    font-size:52px;background:linear-gradient(140deg,var(--grape),var(--coral));
    box-shadow:0 10px 26px rgba(0,0,0,.3);
  }
  .timer-wrap{position:relative;display:grid;place-items:center;width:112px;height:112px;flex:none}
  svg.ring{transform:rotate(-90deg);position:absolute}
  .ring-bg{fill:none;stroke:rgba(255,255,255,.14);stroke-width:8}
  .ring-fg{fill:none;stroke:var(--mint);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .2s}
  .tick{font-size:54px;line-height:1;color:var(--mint);transition:color .2s}
  .tick.low,.ring-fg.low{color:var(--coral);stroke:var(--coral)}
  .q{font-size:clamp(19px,5.2vw,25px);line-height:1.45;text-align:center;margin:12px 0 20px;min-height:72px;display:flex;align-items:center;justify-content:center}
  .opts{display:grid;gap:10px;margin-top:auto}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;
    background:rgba(255,255,255,.07);color:var(--sand);
    border:2px solid rgba(255,255,255,.13);border-radius:14px;
    padding:13px 16px;font-size:16px;transition:background .15s,border-color .15s;
  }
  .opt-key{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.14);color:var(--dim);display:grid;place-items:center;font-size:14px}
  .opt:hover:not(:disabled){background:rgba(255,255,255,.14)}
  .opt:disabled{cursor:default}
  .opt.right{background:rgba(79,224,189,.22);border-color:var(--mint)}
  .opt.right .opt-key{background:var(--mint);color:var(--night)}
  .opt.wrong{background:rgba(255,77,102,.2);border-color:var(--coral)}
  .opt.wrong .opt-key{background:var(--coral);color:#fff}
  .verdict{text-align:center;font-family:"Jua",sans-serif;font-size:17px;height:24px;margin-top:13px;color:var(--dim)}

  /* 결과 */
  #result{align-items:center;text-align:center;justify-content:center}
  .score{font-size:clamp(58px,18vw,96px);line-height:1;color:var(--sun)}
  .score small{font-size:.32em;color:var(--dim)}
  #result h2{font-size:25px;margin:10px 0 4px}
  #result .msg{color:var(--dim);font-size:14.5px;margin:0 0 22px}
  .review{width:100%;max-width:460px;text-align:left;margin-bottom:22px;max-height:230px;overflow-y:auto;padding-right:8px}
  .review div{font-size:13px;line-height:1.65;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);color:var(--dim)}
  .review .qq{color:var(--sand);font-weight:700}
  .review .mark{color:var(--coral);margin-right:6px;font-family:"Jua",sans-serif}
  .review .mark.o{color:var(--mint)}
  .review em{font-style:normal;color:var(--sun)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  @media (max-width:430px){
    .stage{padding:24px 16px 22px}
    .pic{width:76px;height:76px;font-size:40px;border-radius:20px}
    .mid{gap:12px}
  }
</style>
</head>
<body>
<main class="stage">

  <section id="home" class="screen on">
    <div class="bolt">⚡</div>
    <h1>번쩍 퀴즈</h1>
    <p>레벨이 올라갈수록 문제는 어려워지고<br>주어지는 시간은 짧아집니다.</p>
    <button class="start" id="btnStart">시작하기</button>
  </section>

  <section id="levels" class="screen pick">
    <h2>레벨을 고르세요</h2>
    <p class="sub">레벨마다 난이도와 제한 시간이 다릅니다</p>
    <div class="levels">
      <button class="lvl" data-l="1"><span class="lvl-n">1</span><span><b>몸풀기 · 7초</b><span>누구나 아는 상식</span></span></button>
      <button class="lvl" data-l="2"><span class="lvl-n">2</span><span><b>진짜 상식 · 5초</b><span>알 듯 말 듯한 문제</span></span></button>
      <button class="lvl" data-l="3"><span class="lvl-n">3</span><span><b>함정 지대 · 3초</b><span>헷갈리는 보기만 모았습니다</span></span></button>
    </div>
    <button class="back" id="btnHome">처음으로</button>
  </section>

  <section id="setup" class="screen pick">
    <h2>몇 문제 푸실래요?</h2>
    <p class="sub" id="setupSub"></p>
    <div class="counts">
      <button class="count" data-n="5">5<span>가볍게</span></button>
      <button class="count" data-n="10">10<span>기본</span></button>
      <button class="count" data-n="15">15<span>도전</span></button>
      <button class="count" data-n="20">20<span>끝까지</span></button>
    </div>
    <button class="back" id="btnBackLvl">레벨 다시 고르기</button>
  </section>

  <section id="quiz" class="screen">
    <div class="hud">
      <span class="tag" id="lvlTag">레벨 1</span>
      <span>문제 <b id="qNum">1</b> / <span id="qTotal">5</span></span>
      <span>맞힌 개수 <b id="qScore">0</b></span>
    </div>
    <div class="mid">
      <div class="pic" id="pic">❓</div>
      <div class="timer-wrap">
        <svg class="ring" width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
          <circle class="ring-bg" cx="56" cy="56" r="50"></circle>
          <circle class="ring-fg" id="ring" cx="56" cy="56" r="50" stroke-dasharray="314.16"></circle>
        </svg>
        <div class="tick" id="tick">5</div>
      </div>
    </div>
    <p class="q" id="qText"></p>
    <div class="opts" id="opts"></div>
    <div class="verdict" id="verdict"></div>
  </section>

  <section id="result" class="screen">
    <div class="score"><span id="rScore">0</span><small>/<span id="rTotal">5</span></small></div>
    <h2 id="rTitle"></h2>
    <p class="msg" id="rMsg"></p>
    <div class="review" id="review"></div>
    <button class="start" id="btnAgain">다시 풀기</button>
  </section>

</main>

<script>
/* [질문, [보기4], 정답index, 해설, 그림] */

const LEVEL = {1:{t:7,name:"레벨 1 · 몸풀기"},2:{t:5,name:"레벨 2 · 진짜 상식"},3:{t:3,name:"레벨 3 · 함정 지대"}};
const CIRC = 2 * Math.PI * 50;
const $ = id => document.getElementById(id);
let level=1, limit=5, deck=[], idx=0, score=0, total=5, log=[], timer=null, left=5, locked=false;

/* ── 효과음 ── */
let ac = null;
function audio(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac }
function beep(freq, start, dur, type='triangle', vol=.22){
  const c = audio(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + start);
  g.gain.setValueAtTime(0, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, c.currentTime + start + .02);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05);
}
const sfxRight = () => { beep(784,0,.12); beep(1046,.09,.16); beep(1318,.18,.3) };
const sfxWrong = () => { beep(200,0,.2,'sawtooth',.18); beep(140,.14,.35,'sawtooth',.18) };
const sfxTimeUp = () => { beep(330,0,.15,'square',.15); beep(220,.12,.3,'square',.15) };
const sfxTick   = () => beep(880,0,.05,'sine',.08);
const sfxEnd    = () => { beep(523,0,.14); beep(659,.12,.14); beep(784,.24,.14); beep(1046,.36,.4) };

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id===id)) }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]] } return a }

$('btnStart').onclick = () => { audio(); show('levels') };
$('btnHome').onclick = () => show('home');
$('btnBackLvl').onclick = () => show('levels');
$('btnAgain').onclick = () => show('levels');
document.querySelectorAll('.lvl').forEach(b => b.onclick = () => {
  level = +b.dataset.l; limit = LEVEL[level].t;
  $('setupSub').textContent = `${LEVEL[level].name} · 문제당 ${limit}초`;
  show('setup');
});
document.querySelectorAll('.count').forEach(b => b.onclick = () => begin(+b.dataset.n));

function begin(n){
  total = n; idx = 0; score = 0; log = [];
  /* 한 판 안에서 문제가 겹치지 않도록 섞은 뒤 앞에서 n개만 사용 */
  deck = shuffle(BANK[level].slice()).slice(0, n).map(q => {
    const pairs = q[1].map((t,i) => ({t, ok:i===q[2]}));
    shuffle(pairs);
    return { q:q[0], opts:pairs, ans:pairs.findIndex(p=>p.ok), why:q[3], pic:q[4] };
  });
  $('qTotal').textContent = n;
  $('lvlTag').textContent = LEVEL[level].name;
  show('quiz');
  render();
}

function render(){
  const item = deck[idx];
  locked = false; left = limit;
  $('qNum').textContent = idx+1;
  $('qScore').textContent = score;
  $('qText').textContent = item.q;
  $('pic').textContent = item.pic;
  $('verdict').textContent = '';
  const box = $('opts'); box.innerHTML = '';
  item.opts.forEach((o,i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="opt-key">${i+1}</span><span>${o.t}</span>`;
    b.onclick = () => pick(i);
    box.appendChild(b);
  });
  paint();
  timer = setInterval(() => {
    left--; paint();
    if(left > 0 && left <= 2) sfxTick();
    if(left <= 0) pick(-1);
  }, 1000);
}

function paint(){
  const low = left <= 2;
  $('tick').textContent = Math.max(left,0);
  $('tick').classList.toggle('low', low);
  $('ring').classList.toggle('low', low);
  $('ring').style.strokeDashoffset = CIRC * (1 - Math.max(left,0)/limit);
}

function pick(i){
  if(locked) return;
  locked = true; clearInterval(timer);
  const item = deck[idx], ok = i === item.ans;
  [...$('opts').children].forEach((b,n) => {
    b.disabled = true;
    if(n === item.ans) b.classList.add('right');
    if(n === i && !ok) b.classList.add('wrong');
  });
  if(ok){ score++; $('verdict').textContent='정답!'; sfxRight() }
  else if(i === -1){ $('verdict').textContent='시간 초과'; sfxTimeUp() }
  else { $('verdict').textContent='오답'; sfxWrong() }
  $('qScore').textContent = score;
  log.push({ q:item.q, a:item.opts[item.ans].t, why:item.why, pic:item.pic, ok });
  setTimeout(() => { idx++; idx < total ? render() : finish() }, 1150);
}

function finish(){
  sfxEnd();
  const rate = score/total;
  $('rScore').textContent = score;
  $('rTotal').textContent = total;
  $('rTitle').textContent = rate===1 ? '전부 정답' : rate>=.7 ? '꽤 잘 아시네요' : rate>=.4 ? '절반은 건졌습니다' : '해설부터 보고 가세요';
  $('rMsg').textContent = `${LEVEL[level].name} · ${total}문제 중 ${score}개 정답`;
  $('review').innerHTML = log.map(l =>
    `<div><span class="mark ${l.ok?'o':''}">${l.ok?'O':'X'}</span>${l.pic} <span class="qq">${l.q}</span><br>정답 <em>${l.a}</em><br>${l.why}</div>`
  ).join('');
  show('result');
}

document.addEventListener('keydown', e => {
  if(!$('quiz').classList.contains('on') || locked) return;
  const n = parseInt(e.key,10);
  if(n>=1 && n<=4) pick(n-1);
});
</script>
